name: mina_robot
description: "Mina AI - Ứng dụng Robot thông minh điều khiển giọng nói (Sherpa-ONNX TinyML + Giao thức XiaoZhi + MCP 68 Động tác MR-C3024FX)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  sherpa_onnx: 1.12.30
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/kws/encoder.int8.onnx
    - assets/models/kws/decoder.onnx
    - assets/models/kws/joiner.int8.onnx
    - assets/models/kws/tokens.txt
    - assets/models/kws/keywords.txt
