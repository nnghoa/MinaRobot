name: Build Mina Tina Linux Daemon (ARMv7)

on:
  push:
    paths:
      - 'tina_linux/**'
      - '.github/workflows/build_tina_linux.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tina_linux/go.sum

      - name: Build static ARMv7 binary
        working-directory: tina_linux
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o mina_tina_daemon .
          ls -lh mina_tina_daemon
          file mina_tina_daemon

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mina_tina_daemon_armv7
          path: tina_linux/mina_tina_daemon
