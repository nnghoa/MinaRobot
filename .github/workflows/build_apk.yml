name: Build Mina Robot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Dependencies & Generate Gradle Wrapper
        run: |
          flutter create --platforms=android --org com.mtc --project-name mina_robot .
          git checkout -- pubspec.yaml lib android/app android/build.gradle android/settings.gradle android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          flutter pub get

      - name: Build Release APK (ARMv7 32-bit Allwinner A33 + ARM64)
        run: flutter build apk --release

      - name: Upload Mina_AI_v1.1.0_release.apk
        uses: actions/upload-artifact@v4
        with:
          name: Mina_AI_v1.1.0_release
          path: build/app/outputs/flutter-apk/app-release.apk
